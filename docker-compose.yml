version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadharvest_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./config:/app/config
    environment:
      - LEADHARVEST_DEBUG=false
      - LEADHARVEST_MIN_PAGE_DELAY_SEC=2.0
      - LEADHARVEST_MAX_PAGE_DELAY_SEC=5.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leadharvest_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
